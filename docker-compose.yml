services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: policy-qa-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: policy_qa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d policy_qa"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: policy-qa-backend
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/policy_qa
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: policy_qa
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src
    command: npm start --workspace=policy-qa-backend

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: policy-qa-frontend
    ports:
      - "3001:3001"
    environment:
      VITE_API_BASE_URL: http://backend:3000
    volumes:
      - ./frontend/src:/app/frontend/src
    command: npm run dev --workspace=policy-qa-frontend
    depends_on:
      - backend

volumes:
  postgres_data:
